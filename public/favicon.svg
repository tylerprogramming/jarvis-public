<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Jarvis">
  <!-- The arc reactor the HUD is built around. Kept to a ring and a core
       because anything finer turns to mush at 16 pixels, which is the size
       this is actually seen at. The accent is rewritten at runtime to match
       the active theme, so the tab icon follows the dashboard. -->
  <circle cx="16" cy="16" r="16" fill="#040810"/>
  <g fill="none" stroke="#38bdf8" stroke-linecap="round">
    <circle cx="16" cy="16" r="11.5" stroke-width="1.4" opacity=".45"/>
    <circle cx="16" cy="16" r="7.5" stroke-width="1.8" opacity=".85"/>
    <!-- four ticks, so it still reads as an instrument and not a bullseye -->
    <path d="M16 1.6v3.2M16 27.2v3.2M1.6 16h3.2M27.2 16h3.2" stroke-width="1.6" opacity=".7"/>
  </g>
  <circle cx="16" cy="16" r="3.4" fill="#7dd3fc"/>
</svg>
