<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S.</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<meta name="theme-color" content="#040810">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="stars"></canvas>
<canvas id="brain"></canvas>

<header>
  <div class="logo"><h1 id="name">J.A.R.V.I.S.</h1><span id="tagline"></span></div>
  <div class="modes">
    <span><span class="dot" id="dot-core"></span>CORE · <b id="m-core">ONLINE</b></span>
    <span><span class="dot" id="dot-link"></span>LINK · <b id="m-link">ONLINE</b></span>
    <span><span class="dot" id="dot-runner"></span>RUNNER · <b id="m-runner">IDLE</b></span>
  </div>
</header>

<div class="rail left">
  <div class="panel" title="Your audience numbers, refreshed by the collector. Arrows show the weekly change.">
    <h2>SYSTEM VITALS <small>AUDIENCE.LINK</small></h2>
    <div id="vitals"></div>
  </div>
  <div class="panel" title="What to do next, most important first. Click one to mark it done. Agents rewrite these; so can you, just ask.">
    <h2>DIRECTIVES <small id="dir-cap">QUEUE</small></h2>
    <div id="directives"></div>
  </div>
  <div class="panel" title="Channels you watch. Flags videos running well above that channel's own baseline, so it catches hot topics rather than big channels.">
    <h2>RADAR <small>COMPETITOR.WATCH</small></h2>
    <div id="radar"></div>
  </div>
  <div class="panel" title="Newest reports and drafts your agents wrote. Click one to read it.">
    <h2>DOCUMENTS <small>INBOX.TRAIL</small></h2>
    <div id="documents"></div>
  </div>
</div>

<div class="rail right">
  <div class="panel" id="comms">
    <h2>COMMS <small id="brain-label">LINK</small></h2>
    <div class="msgs" id="msgs">
      <div class="msg sys">initializing…</div>
    </div>
  </div>
</div>

<div id="agents"></div>

<div id="calstrip"></div>

<div id="primary">
  <div class="label" id="pd-label">PRIMARY DIRECTIVE</div>
  <div class="big"><span id="pd-num">—</span> <small>SUBS</small></div>
  <div class="meta" id="pd-meta"></div>
  <div class="deploy" id="pd-deploy"></div>
</div>

<div id="bar">
  <button id="wake" class="ico" aria-label="Wake word" data-tip="Wake word — off. Turn on and just say &quot;jarvis, …&quot; out loud; no clicking.">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2.2"/><path d="M7.8 8.4a5.6 5.6 0 0 0 0 7.2M16.2 8.4a5.6 5.6 0 0 1 0 7.2"/><path d="M4.9 5.6a9.6 9.6 0 0 0 0 12.8M19.1 5.6a9.6 9.6 0 0 1 0 12.8" opacity=".5"/></svg>
  </button>

  <input id="cmd" autocomplete="off" placeholder="Ask Jarvis anything — press / to focus">

  <button id="speak" class="ico" aria-label="Spoken replies" data-tip="Spoken replies — on. Answers are read aloud.">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.2L12 5.6v12.8L7.2 14.5H4z"/><path class="waves" d="M15.6 9.4a3.8 3.8 0 0 1 0 5.2M18.3 6.9a7.3 7.3 0 0 1 0 10.2"/></svg>
  </button>

  <button id="theme" class="ico" aria-label="Theme" data-tip="Theme — reactor. Click to cycle.">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg>
  </button>

  <button id="settings-btn" class="ico" aria-label="Settings" data-tip="Settings — name, channels, targets, agents.  ⌘,">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2.1" class="knob"/><circle cx="15" cy="12" r="2.1" class="knob"/><circle cx="8" cy="17" r="2.1" class="knob"/></svg>
  </button>

  <button id="mic" aria-label="Talk" data-tip="Click to talk — records, transcribes, sends.">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/></svg>
  </button>
</div>

<div id="modal"><div class="inner"><h3 id="modal-title"></h3><div id="modal-body"></div></div></div>

<script src="vendor/three.min.js"></script>
<script src="app.js"></script>
<script src="brain.js"></script>
<script src="settings.js"></script>
</body>
</html>
